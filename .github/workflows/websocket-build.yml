                -Dtests=disabled \
                -Dminiupnpc=disabled \
                -Dreadline=disabled \
                -Dcurses=disabled \
                -Dlzo=disabled \
                -Dlz4=disabled \
                -Dzlib=enabled

              meson compile -C build-websocket --verbose

              mkdir -p artifact-linux/lib
