                patchelf --set-rpath "\$ORIGIN/lib" "$exe"
              done
              ldd artifact-bullseye-arm64/tincd > artifact-bullseye-arm64/tincd.ldd.txt
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: tinc-websocket-bullseye-arm64
          path: artifact-bullseye-arm64/

  linux-arm64:
    name: Linux arm64 WebSocket build
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
