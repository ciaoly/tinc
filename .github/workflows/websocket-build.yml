              # Keep bullseye (glibc 2.31) for wide binary compatibility.
              printf "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260831T000000Z bullseye main\ndeb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260831T000000Z bullseye-security main\n" > /etc/apt/sources.list
