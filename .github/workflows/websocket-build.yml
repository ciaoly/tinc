            '

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: tinc-websocket-alpine-arm64
          path: artifact-alpine-arm64/

  windows:
    name: Windows WebSocket build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib

      - name: Install wslay
        shell: msys2 {0}
        run: |
          pacman -S --needed --noconfirm mingw-w64-x86_64-wslay || \
          pacman -S --needed --noconfirm mingw-w64-x86_64-libwslay

      - name: Configure
        shell: msys2 {0}
        run: >
          meson setup build-websocket
          -Dwebsocket=enabled
          -Dstatic=disabled
          -Ddocs=disabled
          -Dtests=disabled
          -Dminiupnpc=disabled
          -Dreadline=disabled
          -Dcurses=disabled
          -Dlzo=disabled
          -Dlz4=disabled
          -Dzlib=enabled

      - name: Build
        shell: msys2 {0}
        run: meson compile -C build-websocket --verbose

      - name: Collect artifacts
        shell: msys2 {0}
        run: |
          mkdir -p artifact-windows
          cp build-websocket/src/tinc.exe artifact-windows/
          cp build-websocket/src/tincd.exe artifact-windows/
          for exe in artifact-windows/*.exe; do
            ldd "$exe" | awk '/mingw64/ { print $3 }' | while read -r dll; do
              [ -n "$dll" ] && cp -n "$dll" artifact-windows/
            done
          done
          ldd artifact-windows/tincd.exe > artifact-windows/tincd.ldd.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: tinc-websocket-windows-x86_64
          path: artifact-windows/
