  alpine:
    name: Alpine WebSocket build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build in Alpine container
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine:latest \
            sh -eux -c '
              apk add --no-cache \
                build-base \
                ca-certificates \
                git \
                linux-headers \
                meson \
                ninja \
                openssl-dev \
                patchelf \
                pkgconf \
                wslay-dev \
                zlib-dev

              meson setup build-websocket-alpine \
                --prefix=/ \
                --sysconfdir=etc \
                --localstatedir=var \
                -Dwebsocket=enabled \
                -Dstatic=disabled \
                -Ddocs=disabled \
                -Dtests=disabled \
                -Dminiupnpc=disabled \
                -Dreadline=disabled \
                -Dcurses=disabled \
                -Dlzo=disabled \
                -Dlz4=disabled \
                -Dzlib=enabled

              meson compile -C build-websocket-alpine --verbose

              mkdir -p artifact-alpine/lib
