              meson setup build-websocket-alpine-arm64 \
                --prefix=/ \
                --sysconfdir=etc \
                --localstatedir=var \
                -Dwebsocket=enabled \
                -Dstatic=disabled \
                -Ddocs=disabled \
                -Dtests=disabled \
                -Dminiupnpc=disabled \
                -Dreadline=disabled \
                -Dcurses=disabled \
                -Dlzo=disabled \
                -Dlz4=disabled \
                -Dzlib=enabled

              meson compile -C build-websocket-alpine-arm64 --verbose

              mkdir -p artifact-alpine-arm64/lib
              cp build-websocket-alpine-arm64/src/tinc artifact-alpine-arm64/
              cp build-websocket-alpine-arm64/src/tincd artifact-alpine-arm64/
              copy_deps() {
                ldd "$1" | while read -r first second third rest; do
