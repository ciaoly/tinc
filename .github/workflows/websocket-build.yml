                  if [ "$second" = "=>" ]; then
                    lib="$third"
                  elif [ "${first#/}" != "$first" ]; then
                    lib="$first"
                  fi
                  case "$lib" in
                    /lib/ld-musl*|/lib/libc.musl*|"") ;;
                    /*) cp -n "$lib" artifact-alpine/lib/ ;;
                  esac
                done
              }
              for exe in artifact-alpine/tinc artifact-alpine/tincd; do
                copy_deps "$exe"
                patchelf --set-rpath "\$ORIGIN/lib" "$exe"
              done
              ldd artifact-alpine/tincd > artifact-alpine/tincd.ldd.txt
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: tinc-websocket-alpine-x86_64
          path: artifact-alpine/

